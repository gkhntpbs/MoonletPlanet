<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Studio — system</title>
<style>
  :root { --void: #090a0d; --surface: #15171c; --line: #23262e; --text: #e8eaf0; --dim: #a7acb8; --accent: #8d82ff; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--void); color: var(--text); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { flex: 1; display: grid; place-items: center; min-width: 0; }
  /* The whole stage, not a square in it: the sky fills it and the system sits in the middle. */
  #system { width: 100%; height: 100vh; display: block; cursor: grab; touch-action: none; }
  #system.dragging { cursor: grabbing; }
  #panel { width: 330px; flex: none; overflow-y: auto; padding: 14px; background: var(--surface); border-left: 1px solid var(--line); }
  h2 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 7px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .row > label { width: 88px; flex: none; color: var(--dim); white-space: nowrap; }
  .row > input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .row > output { width: 40px; flex: none; text-align: right; color: var(--dim); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  button, select { font: inherit; color: var(--text); background: #1d2027; border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; cursor: pointer; width: 100%; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); background: #2a2650; }
  .stack > * + * { margin-top: 5px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
  a { color: var(--accent); }
  #fail { padding: 20px; color: #ff8080; }
  details { border-top: 1px solid var(--line); padding: 4px 0 6px; }
  details > summary { cursor: pointer; list-style: none; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 8px 0 6px; }
  details > summary::before { content: '▸ '; }
  details[open] > summary::before { content: '▾ '; }
  label.check { display: flex; align-items: center; gap: 7px; color: var(--dim); cursor: pointer; margin: 4px 0 6px; }
  input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 10px; }
</style>
</head>
<body>
<div id="stage"><canvas id="system"></canvas></div>
<div id="panel"></div>

<script type="module">
import {
  createPlanetRenderer, archetypeRecipes, solarSystem, systemExample, layoutSystem, systemExtent, placeBody, defaultSky, defaultOrbitStyle,
} from './bundle.js'

const canvas = document.getElementById('system')
const panel = document.getElementById('panel')
let renderer
try {
  renderer = createPlanetRenderer(canvas)
  if (!renderer) throw new Error('This browser has no WebGL2.')
} catch (error) {
  document.body.innerHTML = `<div id="fail">Planet renderer failed:<br><br>${error.message}</div>`
  throw error
}

// The workbench looks through a real camera, with orbit lines and a sky, as the Swift
// studio does; the library's defaults are all off.
const fresh = () => ({
  ...structuredClone(systemExample), showsOrbits: true, perspective: 0.8,
  sky: { ...structuredClone(defaultSky), isVisible: true }, orbitStyle: structuredClone(defaultOrbitStyle),
})
let paused = false
let system = fresh()
// ?az=…&el=… opens the camera at an angle, which is how a screenshot is taken of one.
const params = new URLSearchParams(location.search)
if (params.has('az')) system.viewAzimuth = Number(params.get('az'))
if (params.has('el')) system.viewElevation = Number(params.get('el'))
if (params.has('paused')) paused = true
let selection = null   // null is the star
let spin = 0           // the camera's coast after a flick, radians a second
let coastFriction = 2.2
let clock = 0
let last = performance.now()
const archetypes = Object.keys(archetypeRecipes)

// --- building blocks ----------------------------------------------------------------

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props)
  for (const child of [].concat(children)) node.append(child)
  return node
}
const bound = []
const refresh = () => { for (const f of bound) f() }
const sync = () => { refresh(); rebuildBodies() }

/** A slider on a field of whatever `target()` returns when it is moved. */
function slider(label, target, key, min, max, step = 0.01) {
  const read = () => target()?.[key] ?? 0
  // Whole-number settings read as whole numbers.
  const digits = step >= 1 ? 0 : 2
  const input = el('input', { type: 'range', min, max, step, value: read() })
  const out = el('output', {}, [Number(read()).toFixed(digits)])
  input.addEventListener('input', () => {
    const t = target(); if (!t) return
    t[key] = Number(input.value); out.textContent = Number(input.value).toFixed(digits)
  })
  bound.push(() => { input.value = String(read()); out.textContent = Number(read()).toFixed(digits) })
  return el('div', { className: 'row' }, [el('label', {}, [label]), input, out])
}

function check(label, target, key) {
  const box = el('input', { type: 'checkbox' })
  box.addEventListener('change', () => { const t = target(); if (t) t[key] = box.checked; refresh() })
  bound.push(() => { box.checked = !!target()?.[key] })
  return el('label', { className: 'check' }, [box, label])
}

const hex = c => '#' + [c.red, c.green, c.blue].map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('')
const fromHex = h => ({ red: parseInt(h.slice(1, 3), 16) / 255, green: parseInt(h.slice(3, 5), 16) / 255, blue: parseInt(h.slice(5, 7), 16) / 255, opacity: 1 })
const white = { red: 1, green: 1, blue: 1, opacity: 1 }

function swatch(label, target, key) {
  const input = el('input', { type: 'color' })
  input.addEventListener('input', () => { const t = target(); if (t) t[key] = fromHex(input.value) })
  bound.push(() => { input.value = hex(target()?.[key] ?? white) })
  return el('div', { className: 'swatch' }, [input, el('span', {}, [label])])
}

function group(title, children, open = false) {
  const node = el('details', { open }, [el('summary', {}, [title]), ...[].concat(children)])
  panel.append(node)
  return node
}

// What the sliders point at.
const sys = () => system
const sky = () => system.sky
const lines = () => system.orbitStyle
const body = () => selection === null ? null : system.bodies[selection]
const recipe = () => selection === null ? system.star : system.bodies[selection]?.recipe
const palette = () => recipe()?.palette

// --- the system ---------------------------------------------------------------------

const bodies = el('div', { className: 'grid' })
function rebuildBodies() {
  bodies.replaceChildren(...[null, ...system.bodies.keys()].map(i => {
    const name = i === null ? 'Star' : `${i + 1}. ${archetypes[system.bodies[i].recipe.archetype]}`
    const b = el('button', { textContent: name, className: i === selection ? 'on' : '' })
    b.addEventListener('click', () => { selection = i; sync() })
    return b
  }))
  orbitGroup.style.display = selection === null ? 'none' : ''
  selectedGroup.querySelector('summary').textContent = selection === null ? 'The star' : 'Selected planet'
}

const add = el('select', {}, [el('option', { textContent: 'Add planet…', value: '' }),
  ...Object.keys(solarSystem).filter(n => n !== 'sun').map(n => el('option', { value: 's:' + n, textContent: n })),
  ...archetypes.filter(n => n !== 'star').map(n => el('option', { value: 'a:' + n, textContent: n }))])
add.addEventListener('change', () => {
  if (!add.value) return
  const [kind, name] = add.value.split(':')
  const r = structuredClone(kind === 's' ? solarSystem[name] : archetypeRecipes[name])
  const furthest = Math.max(system.starRadius * 1.5, ...system.bodies.map(b => b.distance))
  system.bodies.push({ recipe: r, radius: 0.35, distance: furthest + 1.2, phase: Math.random() * 6.28 - 3.14, speed: 0.1, inclination: 0, node: 0 })
  selection = system.bodies.length - 1
  add.value = ''
  sync()
})
const button = (text, action) => { const b = el('button', { textContent: text }); b.addEventListener('click', action); return b }
const pause = button('Pause', () => { paused = !paused; pause.textContent = paused ? 'Play' : 'Pause' })

panel.append(
  el('div', { className: 'hint', style: 'margin-bottom:10px' }, [el('a', { href: './index.html', textContent: '← one planet' })]),
  el('h2', {}, ['System']),
  bodies,
  el('div', { className: 'stack', style: 'margin-top:6px' }, [
    add,
    button('Remove selected', () => { if (selection === null) return; system.bodies.splice(selection, 1); selection = null; sync() }),
    button('Reset camera', () => { system.viewAzimuth = 0; system.viewElevation = 0.35; system.zoom = 1; spin = 0; refresh() }),
    button('Reset to example', () => { system = fresh(); selection = null; sync() }),
    pause,
  ]),
  el('div', { className: 'hint' }, ['Drag a planet to move it; drag empty space to turn the camera.']),
)

group('Camera', [
  // All the way round, and from below the plane as well as above it.
  slider('Turn', sys, 'viewAzimuth', -Math.PI, Math.PI),
  slider('View angle', sys, 'viewElevation', -Math.PI / 2, Math.PI / 2),
  // 0 is flat; above it nearer is bigger and every pole stays put as the camera turns.
  slider('Depth', sys, 'perspective', 0, 1),
  slider('Zoom', sys, 'zoom', 0.5, 4),
  // How soon a flicked camera stops coasting.
  slider('Coast stop', () => ({ get v() { return coastFriction }, set v(x) { coastFriction = x } }), 'v', 0.3, 8),
], true)

group('Sky', [
  check('Stars', sky, 'isVisible'),
  slider('Count', sky, 'starCount', 0, 5000, 100),
  el('div', { className: 'row' }, [el('label', {}, ['Sky seed']),
    button('New sky', () => { system.sky.seed = Math.floor(Math.random() * 0xffffffff); refresh() })]),
  slider('Brightness', sky, 'brightness', 0, 2),
  slider('Star size', sky, 'starSize', 0.3, 3),
  slider('Colour range', sky, 'warmth', 0, 2),
  slider('Twinkle', sky, 'twinkle', 0, 1),
  // A Milky Way: a share of the stars gathered in a belt across the sky.
  slider('Band', sky, 'bandStrength', 0, 1),
  slider('Band tilt', sky, 'bandTilt', -Math.PI / 2, Math.PI / 2),
  el('div', { className: 'swatches' }, [swatch('star colour', sky, 'color')]),
])

group('Orbits', [
  check('Orbit lines', sys, 'showsOrbits'),
  slider('Line opacity', lines, 'opacity', 0, 1),
  slider('Line width', lines, 'width', 0.3, 4),
  el('div', { className: 'swatches' }, [swatch('line colour', lines, 'color')]),
  // Every orbit at once; 0 stops them all where they are.
  slider('All speeds', sys, 'orbitSpeed', 0, 4),
])

group('Light', [
  slider('Star tint', sys, 'lightTint', 0, 1),
  // How much dimmer the outer worlds are; 1 is the inverse-square law.
  slider('Falloff', sys, 'lightFalloff', 0, 1),
  slider('Star size', sys, 'starRadius', 0.3, 2),
])

const orbitGroup = group('Orbit', [
  slider('Distance', body, 'distance', 1.05, 12),
  slider('Size', body, 'radius', 0.05, 1.5),
  slider('Position', body, 'phase', -Math.PI, Math.PI),
  // Zero holds it where it is put.
  slider('Speed', body, 'speed', -0.6, 0.6),
  // Out of the system's plane, and which way across it.
  slider('Inclination', body, 'inclination', -Math.PI / 2, Math.PI / 2),
  slider('Node', body, 'node', -Math.PI, Math.PI),
], true)

// Everything about the selected body itself — the same controls as the one-planet page.
const archetypeSelect = el('select', {}, archetypes.map((name, i) => el('option', { value: String(i), textContent: name })))
archetypeSelect.addEventListener('change', () => {
  const r = recipe(); if (!r) return
  const next = structuredClone(archetypeRecipes[archetypes[Number(archetypeSelect.value)]])
  Object.assign(next, { seed: r.seed, axialTilt: r.axialTilt, ringOpacity: r.ringOpacity, life: r.life })
  if (selection === null) system.star = next; else system.bodies[selection].recipe = next
  sync()
})
bound.push(() => { archetypeSelect.value = String(recipe()?.archetype ?? 0) })
const lifeSelect = el('select', {}, ['Sterile', 'Simple life', 'Civilisation', 'Spacefaring', 'Interplanetary']
  .map((label, i) => el('option', { value: String(i), textContent: label })))
lifeSelect.addEventListener('change', () => { const r = recipe(); if (r) r.life = Number(lifeSelect.value) })
bound.push(() => { lifeSelect.value = String(recipe()?.life ?? 0) })
const ringToggle = (() => {
  const box = el('input', { type: 'checkbox' })
  box.addEventListener('change', () => {
    const r = recipe(); if (!r) return
    r.ringOpacity = box.checked ? Math.max(r.ringOpacity ?? 0, 1) : 0
    refresh()
  })
  bound.push(() => { box.checked = (recipe()?.ringOpacity ?? 0) > 0 })
  return el('label', { className: 'check' }, [box, 'Rings'])
})()

const selectedGroup = group('Selected planet', [
  el('div', { className: 'stack' }, [archetypeSelect, lifeSelect]),
  el('h2', {}, ['Body']),
  slider('Axial tilt', recipe, 'axialTilt', -Math.PI / 2, Math.PI / 2),
  slider('Longitude', recipe, 'rotationPhase', -Math.PI, Math.PI),
  slider('Rotation', recipe, 'rotationSpeed', 0, 0.6),
  slider('Exposure', recipe, 'exposure', 0.2, 4),
  slider('Luminosity', recipe, 'luminosity', 0, 1),
  el('h2', {}, ['Surface']),
  slider('Turbulence', recipe, 'turbulence', 0, 1),
  slider('Detail', recipe, 'detail', 0, 1),
  slider('Warp', recipe, 'warpStrength', 0, 1.5),
  slider('Bands', recipe, 'bandCount', 0, 30, 0.5),
  slider('Band edge', recipe, 'bandSharpness', 0, 1),
  slider('Storms', recipe, 'stormCount', 0, 5, 1),
  slider('Storm force', recipe, 'stormStrength', 0, 1.5),
  slider('Features', recipe, 'featureAmount', 0, 1),
  slider('Roughness', recipe, 'roughness', 0, 1),
  slider('Fine detail', recipe, 'microDetail', 0, 1.5),
  el('h2', {}, ['Air']),
  slider('Cloud cover', recipe, 'cloudCoverage', 0, 1),
  slider('Cloud speed', recipe, 'cloudSpeed', 0, 4),
  slider('Density', recipe, 'atmosphereDensity', 0, 1),
  slider('Glow', recipe, 'atmosphereGlow', 0, 2),
  el('h2', {}, ['Ice']),
  slider('Coverage', recipe, 'iceCoverage', 0, 1),
  slider('Lapse rate', recipe, 'iceAltitude', 0, 1),
  slider('Asymmetry', recipe, 'polarAsymmetry', -0.6, 0.6),
  el('h2', {}, ['Rings']),
  ringToggle,
  slider('Opacity', recipe, 'ringOpacity', 0, 2),
  slider('Inner', recipe, 'ringInnerRadius', 1.02, 2.2),
  slider('Outer', recipe, 'ringOuterRadius', 1.1, 3.4),
  slider('Ringlets', recipe, 'ringDetail', 0, 1),
  el('h2', {}, ['In orbit']),
  slider('Stations', recipe, 'stationCount', 0, 4, 1),
  slider('Orbit', recipe, 'stationOrbitRadius', 1.03, 1.8),
  slider('Speed', recipe, 'stationSpeed', 0, 1.5),
  slider('Inclination', recipe, 'stationInclination', 0, Math.PI / 2),
  slider('Size', recipe, 'stationSize', 0.5, 3),
  el('h2', {}, ['Palette']),
  el('div', { className: 'swatches' }, [
    swatch('highlight', palette, 'highlight'), swatch('primary', palette, 'primary'), swatch('shadow', palette, 'shadow'),
    swatch('storm', palette, 'storm'), swatch('atmosphere', palette, 'atmosphere'),
    swatch('ring', palette, 'ring'), swatch('ice', palette, 'ice'), swatch('growth', palette, 'life'),
  ]),
])
sync()
// ?open opens every group, for a screenshot of the whole panel.
if (params.has('open')) for (const d of panel.querySelectorAll('details')) d.open = true

// --- dragging -------------------------------------------------------------------------

let dragging = null
let camera = null   // while turning the camera
const toSystem = event => {
  const rect = canvas.getBoundingClientRect()
  const scale = Math.min(rect.width, rect.height) / 2 / systemExtent(system)
  return [(event.clientX - rect.left - rect.width / 2) / scale, (rect.top + rect.height / 2 - event.clientY) / scale]
}
canvas.addEventListener('pointerdown', event => {
  const [x, y] = toSystem(event)
  let best = null
  for (const p of layoutSystem(system, clock)) {
    if (p.index === null) continue
    const d = Math.hypot(p.x - x, p.y - y) - p.radius
    if (d < 0.6 && (!best || d < best.d)) best = { index: p.index, d }
  }
  canvas.setPointerCapture(event.pointerId); canvas.classList.add('dragging')
  spin = 0
  if (!best) {
    camera = { x: event.clientX, y: event.clientY, azimuth: system.viewAzimuth ?? 0, elevation: system.viewElevation, lastX: event.clientX, lastT: performance.now(), velocity: 0 }
    return
  }
  dragging = best.index; selection = best.index; sync()
})
canvas.addEventListener('pointermove', event => {
  if (camera) {
    // How fast it is moving, for the coast when it is let go.
    const now = performance.now(), dt = Math.max(now - camera.lastT, 1) / 1000
    camera.velocity = camera.velocity * 0.6 + (-(event.clientX - camera.lastX) * 0.008 / dt) * 0.4
    camera.lastX = event.clientX; camera.lastT = now
    const turn = camera.azimuth - (event.clientX - camera.x) * 0.008
    // Wrapped into −π…π, which is the slider's range.
    system.viewAzimuth = turn - 2 * Math.PI * Math.round(turn / (2 * Math.PI))
    system.viewElevation = Math.min(Math.max(camera.elevation + (event.clientY - camera.y) * 0.006, -Math.PI / 2), Math.PI / 2)
    refresh()
    return
  }
  if (dragging === null) return
  const [x, y] = toSystem(event)
  placeBody(system, dragging, x, y, clock)
  refresh()
})
const drop = () => {
  // A flick keeps turning and runs down, which is most of what makes it feel like a camera.
  if (camera && performance.now() - camera.lastT < 80) spin = camera.velocity
  dragging = null; camera = null; canvas.classList.remove('dragging')
}
canvas.addEventListener('pointerup', drop)
canvas.addEventListener('pointercancel', drop)
// The wheel zooms, as it would on any camera.
canvas.addEventListener('wheel', event => {
  event.preventDefault()
  system.zoom = Math.min(Math.max((system.zoom ?? 1) * Math.exp(-event.deltaY * 0.0015), 0.5), 4)
  refresh()
}, { passive: false })

// --- loop -----------------------------------------------------------------------------

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1)
  if (!paused) clock += dt
  last = now
  if (Math.abs(spin) > 0.002 && !camera) {
    const turn = (system.viewAzimuth ?? 0) + spin * dt
    system.viewAzimuth = turn - 2 * Math.PI * Math.round(turn / (2 * Math.PI))
    spin *= Math.exp(-dt * coastFriction)
    refresh()
  } else if (!camera) spin = 0
  const rect = canvas.getBoundingClientRect()
  renderer.renderSystem(system, clock, rect.width, rect.height, devicePixelRatio)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
