<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Studio — web</title>
<style>
  :root {
    --void: #090a0d;
    --surface: #15171c;
    --line: #23262e;
    --text: #e8eaf0;
    --dim: #a7acb8;
    --accent: #8d82ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--void); color: var(--text);
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #stage { flex: 1; display: grid; place-items: center; position: relative; min-width: 0; }
  #planet { width: min(88vh, 100%); aspect-ratio: 1; display: block; }
  #note {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #000a; padding: 6px 10px; border-radius: 6px; color: var(--accent);
    opacity: 0; transition: opacity .2s;
  }
  #note.on { opacity: 1; }
  #panel {
    width: 330px; flex: none; overflow-y: auto; padding: 14px;
    background: var(--surface); border-left: 1px solid var(--line);
  }
  h2 {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); margin: 18px 0 7px; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .row > label { width: 88px; flex: none; color: var(--dim); white-space: nowrap; }
  .row > input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .row > output { width: 40px; flex: none; text-align: right; color: var(--dim); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  button, select {
    font: inherit; color: var(--text); background: #1d2027;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; cursor: pointer;
    width: 100%; text-align: center;
  }
  button:hover { border-color: var(--accent); }
  select { text-align: left; }
  .stack > * + * { margin-top: 5px; }
  label.check { display: flex; align-items: center; gap: 7px; color: var(--dim); cursor: pointer; }
  input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 10px; }
  #fail { padding: 20px; color: #ff8080; }
</style>
</head>
<body>
<div id="stage"><canvas id="planet"></canvas><div id="note"></div></div>
<div id="panel"></div>

<script type="module">
import {
  createPlanetRenderer, archetypeRecipes, solarSystem, randomized, validateRecipe,
} from './bundle.js'

const canvas = document.getElementById('planet')
const panel = document.getElementById('panel')
const note = document.getElementById('note')

let renderer
try {
  renderer = createPlanetRenderer(canvas)
  if (!renderer) throw new Error('This browser has no WebGL2.')
} catch (error) {
  document.body.innerHTML = `<div id="fail">Planet renderer failed:<br><br>${error.message}</div>`
  throw error
}

// The archetype names, in the order the shader dispatches on. The numbers are a wire format.
const archetypes = Object.keys(archetypeRecipes)

let recipe = structuredClone(solarSystem.saturn)
let paused = false
let clock = 18

const flash = text => {
  note.textContent = text
  note.classList.add('on')
  clearTimeout(flash.timer)
  flash.timer = setTimeout(() => note.classList.remove('on'), 2200)
}

// --- controls -----------------------------------------------------------------------

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props)
  for (const child of [].concat(children)) node.append(child)
  return node
}

/** A slider bound to one field of the recipe. */
function slider(label, key, min, max, step = 0.01) {
  const input = el('input', { type: 'range', min, max, step, value: recipe[key] ?? 0 })
  const out = el('output', {}, [String((recipe[key] ?? 0).toFixed(2))])
  input.addEventListener('input', () => {
    recipe[key] = Number(input.value)
    out.textContent = Number(input.value).toFixed(2)
  })
  slider.bound.push(() => {
    input.value = String(recipe[key] ?? 0)
    out.textContent = Number(recipe[key] ?? 0).toFixed(2)
  })
  return el('div', { className: 'row' }, [el('label', {}, [label]), input, out])
}
slider.bound = []

const hex = c => '#' + [c.red, c.green, c.blue]
  .map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('')
const fromHex = h => ({
  red: parseInt(h.slice(1, 3), 16) / 255,
  green: parseInt(h.slice(3, 5), 16) / 255,
  blue: parseInt(h.slice(5, 7), 16) / 255,
  opacity: 1,
})

const defaults = { ring: { red: .94, green: .9, blue: .83, opacity: 1 }, ice: { red: .93, green: .95, blue: .97, opacity: 1 } }

function swatch(label, key) {
  const input = el('input', { type: 'color', value: hex(recipe.palette[key] ?? defaults[key]) })
  input.addEventListener('input', () => { recipe.palette[key] = fromHex(input.value) })
  slider.bound.push(() => { input.value = hex(recipe.palette[key] ?? defaults[key]) })
  return el('div', { className: 'swatch' }, [input, el('span', {}, [label])])
}

function section(title, children) {
  panel.append(el('h2', {}, [title]), ...[].concat(children))
}

// Planet
const archetypeSelect = el('select', {}, archetypes.map((name, index) =>
  el('option', { value: String(index), textContent: name })))
archetypeSelect.addEventListener('change', () => {
  // Swap the surface function while keeping the things that are about the world rather than
  // its ground: its rings, its tilt and its ice.
  const next = structuredClone(archetypeRecipes[archetypes[Number(archetypeSelect.value)]])
  Object.assign(next, {
    seed: recipe.seed,
    ringOpacity: recipe.ringOpacity, axialTilt: recipe.axialTilt,
    ringInnerRadius: recipe.ringInnerRadius, ringOuterRadius: recipe.ringOuterRadius,
    ringDetail: recipe.ringDetail,
    iceCoverage: recipe.iceCoverage, polarAsymmetry: recipe.polarAsymmetry,
  })
  recipe = next
  sync()
})
slider.bound.push(() => { archetypeSelect.value = String(recipe.archetype) })

const randomButton = el('button', { textContent: 'Randomize' })
randomButton.addEventListener('click', () => {
  recipe = randomized(recipe, Math.floor(Math.random() * 0xffffffff))
  sync()
})

section('Planet', [
  el('div', { className: 'stack' }, [archetypeSelect, randomButton]),
  slider('Axial tilt', 'axialTilt', 0, Math.PI / 2),
  slider('Longitude', 'rotationPhase', -Math.PI, Math.PI),
])

// Solar system — fixed columns so every button is the same width as every other.
section('Solar system', el('div', { className: 'grid' },
  Object.keys(solarSystem).map(name => {
    const button = el('button', { textContent: name })
    button.addEventListener('click', () => { recipe = structuredClone(solarSystem[name]); sync() })
    return button
  })))

section('Surface', [
  slider('Rotation', 'rotationSpeed', 0, 0.6),
  slider('Turbulence', 'turbulence', 0, 1),
  slider('Detail', 'detail', 0, 1),
  slider('Warp', 'warpStrength', 0, 1.5),
  slider('Bands', 'bandCount', 0, 30, 0.5),
  slider('Band edge', 'bandSharpness', 0, 1),
  slider('Storms', 'stormCount', 0, 5, 1),
  slider('Storm force', 'stormStrength', 0, 1.5),
  slider('Features', 'featureAmount', 0, 1),
  slider('Roughness', 'roughness', 0, 1),
  slider('Fine detail', 'microDetail', 0, 1.5),
])

section('Air', [
  slider('Cloud cover', 'cloudCoverage', 0, 1),
  slider('Cloud speed', 'cloudSpeed', 0, 4),
  slider('Density', 'atmosphereDensity', 0, 1),
  slider('Glow', 'atmosphereGlow', 0, 2),
])

section('Ice', [
  slider('Coverage', 'iceCoverage', 0, 1),
  slider('Lapse rate', 'iceAltitude', 0, 1),
  slider('Asymmetry', 'polarAsymmetry', -0.6, 0.6),
])

section('Rings', [
  slider('Opacity', 'ringOpacity', 0, 2),
  slider('Inner', 'ringInnerRadius', 1.02, 2.2),
  slider('Outer', 'ringOuterRadius', 1.1, 3.4),
  slider('Ringlets', 'ringDetail', 0, 1),
])

section('Light', [
  slider('Azimuth', 'lightAzimuth', 0, Math.PI * 2),
  slider('Elevation', 'lightElevation', -1.2, 1.2),
  slider('Exposure', 'exposure', 0.2, 4),
])

section('Palette', el('div', { className: 'swatches' }, [
  swatch('high', 'highlight'), swatch('main', 'primary'), swatch('dark', 'shadow'),
  swatch('storm', 'storm'), swatch('air', 'atmosphere'), swatch('ring', 'ring'), swatch('ice', 'ice'),
]))

const pause = el('input', { type: 'checkbox' })
pause.addEventListener('change', () => { paused = pause.checked })

const copyButton = el('button', { textContent: 'Copy recipe as JSON' })
copyButton.addEventListener('click', async () => {
  await navigator.clipboard.writeText(JSON.stringify(recipe, null, 2))
  flash('recipe copied')
})

const pasteButton = el('button', { textContent: 'Paste recipe' })
pasteButton.addEventListener('click', async () => {
  try {
    const parsed = JSON.parse(await navigator.clipboard.readText())
    validateRecipe(parsed)
    recipe = parsed
    sync()
    flash('recipe pasted')
  } catch (error) { flash('clipboard is not a recipe') }
})

const saveButton = el('button', { textContent: 'Save 1024px PNG' })
saveButton.addEventListener('click', () => {
  // Rendered and read back in the same task: without `preserveDrawingBuffer` the contents
  // are gone once the browser composites, and a later toDataURL comes back blank.
  renderer.render(recipe, clock, 1024, 1024, 1)
  const link = el('a', { href: canvas.toDataURL('image/png'), download: 'planet.png' })
  link.click()
  flash('saved planet.png')
})

section('Take it with you', el('div', { className: 'stack' }, [
  el('label', { className: 'check' }, [pause, 'Pause']),
  copyButton, pasteButton, saveButton,
]))

function sync() { for (const update of slider.bound) update() }
sync()

// --- drag to turn it ----------------------------------------------------------------
//
// Sideways is the planet's own day; up and down tips the pole, which is the same number that
// opens the rings. The gesture is absolute against where the planet was when it began — an
// incremental one drifts as soon as a frame is dropped.

canvas.style.cursor = 'grab'
let drag = null

canvas.addEventListener('pointerdown', event => {
  drag = { x: event.clientX, y: event.clientY, phase: recipe.rotationPhase ?? 0, tilt: recipe.axialTilt ?? 0 }
  canvas.setPointerCapture(event.pointerId)
  canvas.style.cursor = 'grabbing'
})

canvas.addEventListener('pointermove', event => {
  if (!drag) return
  const scale = 2.2 / Math.max(canvas.clientWidth, 1)
  recipe.rotationPhase = drag.phase - (event.clientX - drag.x) * scale
  recipe.axialTilt = Math.min(Math.max(drag.tilt + (event.clientY - drag.y) * scale * 0.7, 0), Math.PI / 2)
  sync()
})

for (const type of ['pointerup', 'pointercancel']) {
  canvas.addEventListener(type, () => { drag = null; canvas.style.cursor = 'grab' })
}

// --- the loop -----------------------------------------------------------------------

let last = performance.now()

function draw() {
  const size = canvas.clientWidth
  if (size <= 0) return
  try { renderer.render(recipe, clock, size, size, window.devicePixelRatio) }
  catch (error) { flash(error.message) }
}

// `?still` draws one frame and stops. An open requestAnimationFrame loop means a headless
// browser's virtual time never runs out, so this is the only way to screenshot the page —
// which is how it gets checked rather than assumed.
if (new URLSearchParams(location.search).has('still')) {
  draw()
  document.title = 'Planet Studio — still'
} else {
  const frame = now => {
    if (!paused) clock += (now - last) / 1000
    last = now
    draw()
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}
</script>
</body>
</html>
