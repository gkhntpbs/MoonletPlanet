name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # A smoke test that the gallery still runs end to end. Deliberately *not* a byte
      # comparison against the committed images: a hosted runner renders on different
      # hardware — often with no Metal device at all — so identical bytes were never a thing
      # this could ask for. The real "does it draw" check is the web job below, which runs
      # the same shader in a browser.
      - name: Render the documentation images
        run: swift run PlanetGallery
      - name: Discard the render
        run: git checkout -- Documentation/ || true

  web:
    name: Web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The GLSL is generated from the Metal source. This is the job that stops the two
      # drifting, which is the only real risk of shipping the same shader twice.
      - name: Shader is in sync with the Metal source
        run: cd web && npm run check:source
      - name: Test
        run: cd web && npm test
      - name: Install
        run: cd web && npm install --no-audit --no-fund
      - name: Typecheck
        run: cd web && npm run typecheck
      # A shader that compiles is not a shader that draws, so this one runs it: real Chrome,
      # real WebGL2, and an assertion on how much of each canvas came back painted.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Browser acceptance
        run: cd web && npm run accept
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
